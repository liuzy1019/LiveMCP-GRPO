[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livemcp-grpo"
version = "0.1.0"
description = "State-Machine Data Synthesis + Constrained GRPO for Multi-Step MCP Tool Use"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "liuzy1019", email = "liuzy1019@buaa.edu.cn"},
]
requires-python = ">=3.11,<3.12"
keywords = [
    "agentic-rl",
    "grpo",
    "mcp",
    "multi-turn",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.10.0",
    "numpy>=2.0,<2.3",
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
    "loguru==0.7.3",
    "packaging==25.0",
    "einops==0.8.0",
    "scipy==1.13.0",
    "safetensors==0.7.0",
    "hydra-core==1.3.3",
    "omegaconf==2.3.0",
    "pyarrow==23.0.1",
    "pandas==2.2.3",
    "huggingface_hub==1.22.0",
    "protobuf==5.29.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "black>=24.0",
    "ruff>=0.6.5",
    "mypy>=1.11.1",
    "pre-commit>=4.6.0",
    "matplotlib>=3.9.2",
]
train = [
    "transformers==5.13.0",
    "tokenizers==0.22.2",
    "datasets==4.8.4",
    "trl==0.29.1",
    "peft==0.18.1",
    "accelerate==1.14.0",
    "tensorboard==2.20.0",
    "wandb==0.26.0",
]
rl = [
    # verl 从项目内 ./verl 源码 editable 安装: pip install -e ./verl
    "vllm==0.19.1",
    "ray==2.54.1",
    "tensordict==0.10.0",
    "deepspeed==0.19.2",
    "lm-format-enforcer==0.11.3",
    # 以下依赖由 vLLM 自行解析，不 pin 具体版本：
    # flashinfer-python, flashinfer-cubin, compressed-tensors, xgrammar
    # 如需手动升级，单独 pip install 即可
]
bfcl = [
    "bfcl-eval>=2025.10",
]

[project.urls]
Homepage = "https://github.com/liuzy1019/LiveMCP-GRPO"
Repository = "https://github.com/liuzy1019/LiveMCP-GRPO"
Issues = "https://github.com/liuzy1019/LiveMCP-GRPO/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "requires_llm: requires LLM model inference (slow, skipped by default)",
]
