suite_name: ten_domain_live_mcp_payments_rare_state_v1
servers:
  - configs/live_mcp/calendar.yaml
  - configs/live_mcp/shopping.yaml
  - configs/live_mcp/banking.yaml
  - configs/live_mcp/email.yaml
  - configs/live_mcp/filesystem.yaml
  - configs/live_mcp/payments_rare_state_v1.yaml
  - configs/live_mcp/crm.yaml
