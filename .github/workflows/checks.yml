name: repository-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install configuration parser
        run: python -m pip install PyYAML==6.0.3

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Parse repository configuration
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          import yaml

          for root in (Path("configs"), Path("data/dependency_graphs")):
              for path in root.rglob("*"):
                  if path.suffix in {".yaml", ".yml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  elif path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))

          tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          PY

      - name: Check whitespace errors
        run: git diff --check HEAD
